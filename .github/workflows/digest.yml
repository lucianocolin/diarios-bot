name: Digest de diarios

on:
  schedule:
    # Argentina es UTC-3 todo el año (no tiene horario de verano).
    # Todos los días: al correr los 7 días ya no hace falta correr el día de la
    # semana como cuando era de lunes a viernes.
    #
    # Los horarios están adelantados a propósito. El scheduler de GitHub dispara
    # tarde (se midió una demora de 25 min, y puede ser más si la plataforma
    # está cargada), así que se pide antes para que el mensaje caiga cerca de
    # las 14 y de las 21, que son las horas a las que se quiere recibirlo.
    - cron: "0 15 * * *"   # 12:00 ART
    - cron: "30 21 * * *"  # 18:30 ART
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generar sin enviar"
        type: boolean
        default: false

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generar la página
        run: python -m bot.main --dry-run

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Enviar por Telegram
        if: ${{ inputs.dry_run != true }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANAL: telegram
        # Reutiliza el digest que se generó arriba, para no scrapear dos veces
        # y que los números del mensaje coincidan con los de la página.
        run: python -m bot.main --desde-json

      - name: Guardar el digest como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ github.run_id }}
          path: out/
          retention-days: 7
